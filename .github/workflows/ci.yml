name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  nbdev:
    name: Check notebooks and generated files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project and development tools
        run: uv sync --locked --group dev

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run nbdev checks
        run: uv run nbdev-prepare

      - name: Check for uncommitted generated changes
        run: git diff --exit-code

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: uv sync --locked --group dev

      - name: Test package import (eventually to run the pytest stuff here)
        run: |
          uv run python -c "import popidd_sveil"
          uv run python -c "from popidd_sveil.core import inspect_slide, find_label_page, remove_label"

  lint:
    name: Lint, format, and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project and development tools
        run: uv sync --locked --group dev

      - name: Check linting
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy popidd_sveil

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - nbdev
      - test
      - lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
